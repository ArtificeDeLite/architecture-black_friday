name: mongo-sharding-repl

services:
  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"

  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    hostname: mongos_router
    restart: always
    depends_on:
      - configSrv-1
      - configSrv-2
      - configSrv-3
    ports:
      - "27017:27017"
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv-1:27019,configSrv-2:27019,configSrv-3:27019",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  configSrv-1:
    image: mongo:latest # docker образ
    container_name: configSrv-1
    hostname: configSrv-1
    restart: always
    volumes:
      - config-1-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  configSrv-2:
